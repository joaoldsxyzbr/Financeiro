<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>Sem conexão — Financeiro</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0b1220; color: #f8fffc; padding: 24px; }
    main { max-width: 420px; text-align: center; }
    .symbol { margin: 0 auto 24px; background: #149c80; border-radius: 16px;
      width: 64px; height: 64px; display: grid; place-items: center;
      font-size: 38px; font-weight: 800; }
    h1 { font-size: 24px; }
    p { color: #aebac7; line-height: 1.6; }
    a { display: inline-block; margin-top: 14px; padding: 12px 22px;
      border-radius: 10px; background: #149c80; color: white;
      font-weight: 600; text-decoration: none; }
  </style>
</head>
<body><main>
  <div class="symbol" aria-hidden="true">F</div>
  <h1>Você está sem conexão</h1>
  <p>Conecte-se à internet para acessar sua conta. Por segurança, seus dados financeiros não ficam armazenados offline.</p>
  <a href="/">Tentar novamente</a>
</main></body>
</html>
